[project]
name = "supportops-ai"
version = "0.1.0"
description = "Evaluated, evidence-grounded Korean commerce support agent portfolio project"
requires-python = ">=3.11"
dependencies = [
  "rank-bm25==0.2.2",
  "sentence-transformers==6.1.0",
  "pgvector==0.5.0",
  "psycopg[binary]==3.3.6",
  "ollama==0.6.3",
  "fastapi==0.128.0",
  "sqlalchemy==2.0.46",
  "uvicorn==0.40.0",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
