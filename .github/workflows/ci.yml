name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_DB: supportops_test
          POSTGRES_USER: supportops
          POSTGRES_PASSWORD: ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supportops -d supportops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SUPPORTOPS_TEST_DATABASE_URL: postgresql://supportops:ci_test_only@127.0.0.1:5432/supportops_test
      SUPPORTOPS_DB_PASSWORD: ci_test_only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU PyTorch
        run: python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Validate Gold dataset
        run: python scripts/validate_gold_dataset.py
      - name: Test including PostgreSQL and pgvector
        run: python -m pytest -q
